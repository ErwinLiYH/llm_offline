train_variants:
  - local-layoutV2-01
reward_type: sparse
episode_keep_num: 3
train_data_ratio: 0.67
device: cuda:0
n_steps: 1
n_steps_per_epoch: 1
save_interval_epochs: 1
show_progress: false
observation:
  include_map: true
  include_location_sensing: true
  include_wall_sensing: true
  wall_sensing_version: v3
  map_sensing_boundary_risk_threshold: 0.10
network:
  hidden_units: [32, 32]
  activation: gelu
  use_batch_norm: false
  use_layer_norm: true
  dropout_rate: null
algorithm_config:
  batch_size: 8
evaluation:
  enabled: true
  every_epochs: 1
  num_episodes: 1
  seed: 123
