# 在环境和算法配置之后加载；地图每格一个 token，使用二维位置编码。
observation:
  include_dynamic_map: true

network:
  architecture: transformer_map
  width: null
  body_depth: null
  activation: relu
  use_batch_norm: false
  dropout_rate: null
  spatial:
    map_dim: 256
    vector_hidden_units: [128, 128]
    fusion_hidden_units: [256]
    transformer_dim: 128
    transformer_layers: 4
    transformer_heads: 4
    transformer_ffn_dim: 512
