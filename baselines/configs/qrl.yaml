algorithm: qrl

# OGBench state-based QRL defaults. Official PointMaze uses alpha=0.0003;
# official AntMaze uses alpha=0.003, so override PointMaze in an experiment layer.
network:
  hidden_units: [512, 512, 512]
  activation: gelu
  use_batch_norm: false
  use_layer_norm: true
  dropout_rate: null

algorithm_config:
  batch_size: 1024
  learning_rate: 0.0003
  discount: 0.99
  quasimetric_type: iqe
  latent_dim: 512
  iqe_dim_per_component: 8
  eps: 0.05
  actor_loss: ddpgbc
  alpha: 0.003
  const_std: true
  normalize_observations: true
  value_p_curgoal: 0.0
  value_p_trajgoal: 0.0
  value_p_randomgoal: 1.0
  value_geom_sample: true
  actor_p_curgoal: 0.0
  actor_p_trajgoal: 1.0
  actor_p_randomgoal: 0.0
  actor_geom_sample: false
