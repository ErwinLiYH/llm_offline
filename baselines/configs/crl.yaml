algorithm: crl

# OGBench state-based CRL defaults. PointMaze commonly uses alpha=0.03;
# AntMaze commonly uses alpha=0.1, so override it in an experiment layer.
network:
  hidden_units: [512, 512, 512]
  activation: gelu
  use_batch_norm: false
  use_layer_norm: true
  dropout_rate: null

algorithm_config:
  batch_size: 1024
  learning_rate: 0.0003
  discount: 0.99
  latent_dim: 512
  alpha: 0.1
  const_std: true
  normalize_observations: true
  value_p_curgoal: 0.0
  value_p_trajgoal: 1.0
  value_p_randomgoal: 0.0
  value_geom_sample: true
  actor_p_curgoal: 0.0
  actor_p_trajgoal: 1.0
  actor_p_randomgoal: 0.0
  actor_geom_sample: false
