# CrossMaze-Point BC scaling 正式协议：训练地图与测试地图沿用既有多环境设置。
train_mode: all
train_variants:
  - open
  - umaze
  - medium
  - large
  - local-layoutV2-01
  - local-layoutV2-02
  - local-layoutV2-03
  - local-layoutV2-04
  - local-layoutV2-05
  - local-layoutV2-06
  - local-layoutV2-07
  - local-layoutV2-08
  - local-layoutV2-09
  - local-layoutV2-10
  - local-layoutV2-11
  - local-layoutV2-12

eval_mode: all
eval_variants:
  - open
  - umaze
  - medium
  - large
  - local-layoutV2-01
  - local-layoutV2-02
  - local-layoutV2-03
  - local-layoutV2-04
  - local-layoutV2-05
  - local-layoutV2-06
  - local-layoutV2-07
  - local-layoutV2-08
  - local-layoutV2-09
  - local-layoutV2-10
  - local-layoutV2-11
  - local-layoutV2-12
  - test-layoutV2-01
  - test-layoutV2-02
  - test-layoutV2-03
  - test-layoutV2-04
  - test-layoutV2-05
  - test-layoutV2-06

reward_type: sparse
allow_mixed_reward_types: false
seed: 0
sampling_seed: 0
episode_keep_num: 300
episode_keep_per_variant: {}
balance_variant_episode_count: true
train_data_ratio: 0.9
output_root: baseline_runs

# 固定完整数值输入；训练集拟合的 StandardObservationScaler 由 d3rlpy 负责。
observation:
  include_map: true
  include_location_sensing: true
  include_wall_sensing: true
  wall_sensing_version: v3
  map_sensing_boundary_risk_threshold: 0.10

# 500k updates 的正式预算。每 100k 保存并评测一次；每个地图 30 个固定 seed。
n_steps: 500000
n_steps_per_epoch: 25000
save_interval_epochs: 4
show_progress: true
evaluation:
  enabled: true
  every_epochs: 4
  num_episodes: 30
  # 30 个独立环境各自 reset/step；只将同一步的 observation 合成一次推理。
  rollout_batch_size: 30
  seed: 0
  env_config:
    eval_start_goal_mode: random-start-goal

# 正式 run 每个 epoch 写入训练诊断；probe 仅来自训练 episodes，不读取测试图。
training_diagnostics:
  enabled: true
  gradient_sample_interval_updates: 1000
  action_probe_size: 1024
