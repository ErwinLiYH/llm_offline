# Shared protocol layered after one family file and crl.yaml or hiql.yaml.
# Algorithm parameters in crl.yaml/hiql.yaml are the OGBench 1.2.1 defaults.
seed: 0
sampling_seed: 0
train_data_ratio: 0.9
episode_keep_num: null
balance_variant_episode_count: false

# This is the repository's established one-million-offline-update budget.  A
# logical epoch is only a logging/evaluation group, not a dataset pass.
n_steps: 1000000
n_steps_per_epoch: 25000
save_interval_epochs: 10
show_progress: true
output_root: baseline_runs

network:
  hidden_units: [512, 512, 512]
  activation: gelu
  use_batch_norm: false
  use_layer_norm: true
  dropout_rate: null

# Save and evaluate on the same 250k-update boundaries.  Each evaluation rolls
# out *every* train and held-out test variant for 30 episodes, seeds 0..29.
evaluation:
  enabled: true
  every_epochs: 10
  num_episodes: 30
  seed: 0
  env_config: {}
