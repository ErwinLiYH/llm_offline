# AntMaze seedmap32 evaluation on the exact 32 training-map seeds.
# The seed-level training split uses seeds 1-33 with seed 7 held out for validation,
# so the two half-open ranges below select seeds 1-6 and 8-33.
# Layer after configs/eval/eval.ant.1.0.0.yaml; override model_path from the CLI.

config_delete_keys:
  - model_path
  - eval_mode
  - variants

prompt_templete_index: ["dmap-minimal"]
num_episodes: 25

seed_map_eval:
  enabled: true
  seed_ranges:
    - [1, 7]
    - [8, 34]
  seed_count: 32
  selection_seed: 64
  reward_type: sparse
  seed_map_version: v1
  seed_map_size_mode: random
  seed_map_min_size: 9
  seed_map_max_size: 13

eval_start_goal_mode: random-start-goal
