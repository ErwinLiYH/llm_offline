# Seed-map override for config.isb.point.2.0.1.scale16.yaml.
# Corpus capacity: seeds [1, 34), 450 trajectories per seed.
# Split pool: 33 map seeds with 150 trajectories each; 32 train + 1 validation.

train_data_ratio: 0.97

seed_map_train:
  enabled: true
  dataset_path: /projects/u6mx/local_datasets/pointmaze-seed-map-v1-random-size9-15-sparse/1-34-450
  seed_ranges:
    - [1, 34]
  seed_count: 33
  trajectories_per_seed: 150
  selection_seed: 64
  split_unit: seed

# Fresh-map selection for training-time eval; no offline eval corpus is required.
# The layered scale config's eval_num_episodes remains authoritative (0 disables rollout).
# The half-open range [1001, 1051) is exactly seeds 1001 through 1050.
seed_map_eval:
  enabled: true
  seed_ranges:
    - [1001, 1051]
  seed_count: 50
  selection_seed: 64
  reward_type: sparse
  seed_map_version: v1
  seed_map_size_mode: random
  seed_map_min_size: 9
  seed_map_max_size: 15

eval_start_goal_mode: random-start-goal
